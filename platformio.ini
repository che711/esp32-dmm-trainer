; DMM Trainer — прошивка стенда
; Используется pioarduino (Arduino core 3.x): официальная platform-espressif32
; на C6 в связке с Network.h даёт ошибки сборки.

[platformio]
default_envs = esp32-c6-devkitm-1
src_dir = firmware/src
data_dir = data

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
board_build.filesystem = littlefs
extra_scripts = pre:scripts/copy_scenarios.py

[env:esp32-c6-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32-c6-devkitm-1

; Резервная цель: если под рукой обычный ESP32 или C3 —
; всё, кроме распиновки в config.h, переносится без изменений.
[env:esp32-c3-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32-c3-devkitm-1
